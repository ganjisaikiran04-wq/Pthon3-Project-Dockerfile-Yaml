name: Docker CI/CD

on:
#   push:
#     branches:
#       - main
  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout source code
      # --------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------
      # Configure AWS
      # --------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1


      # --------------------------------
      # Login to Amazon ECR
      # --------------------------------
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            250368537874.dkr.ecr.ap-southeast-1.amazonaws.com


      # --------------------------------
      # Build Docker image
      # --------------------------------
      - name: Build Docker image
        run: |
          docker build -t img1:latest .


      # --------------------------------
      # Tag Docker image
      # --------------------------------
      - name: Tag Docker image
        run: |
          docker tag img1:latest \
            250368537874.dkr.ecr.ap-southeast-1.amazonaws.com/img1:latest


      # --------------------------------
      # Push image to ECR
      # --------------------------------
      - name: Push image to ECR
        run: |
          docker push \
            250368537874.dkr.ecr.ap-southeast-1.amazonaws.com/img1:latest


      # --------------------------------
      # Deploy to EC2
      # --------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "====================================="
            echo "Installing required packages..."
            echo "====================================="

            sudo apt-get update -y

            # Install Docker if it is not already installed
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed. Installing Docker..."
              sudo apt-get install -y docker.io
            else
              echo "Docker is already installed."
            fi

            # Install AWS CLI if it is not already installed
            if ! command -v aws >/dev/null 2>&1; then
              echo "AWS CLI is not installed. Installing AWS CLI..."
              sudo apt-get install -y awscli
            else
              echo "AWS CLI is already installed."
            fi


            echo "====================================="
            echo "Enabling and starting Docker..."
            echo "====================================="

            sudo systemctl enable docker
            sudo systemctl start docker

            # Make sure Docker is running
            sudo systemctl is-active --quiet docker

            echo "Docker is running."


            echo "====================================="
            echo "Logging into ECR..."
            echo "====================================="

            aws ecr get-login-password \
              --region ap-southeast-1 | \
              sudo docker login \
              --username AWS \
              --password-stdin \
              250368537874.dkr.ecr.ap-southeast-1.amazonaws.com


            echo "====================================="
            echo "Pulling latest Docker image..."
            echo "====================================="

            sudo docker pull \
              250368537874.dkr.ecr.ap-southeast-1.amazonaws.com/img1:latest


            echo "====================================="
            echo "Stopping old container..."
            echo "====================================="

            sudo docker stop img1 || true


            echo "====================================="
            echo "Removing old container..."
            echo "====================================="

            sudo docker rm img1 || true


            echo "====================================="
            echo "Starting new container..."
            echo "====================================="

            sudo docker run -d \
              --name img1 \
              --restart unless-stopped \
              -p 5000:5000 \
              250368537874.dkr.ecr.ap-southeast-1.amazonaws.com/img1:latest


            echo "====================================="
            echo "Checking container..."
            echo "====================================="

            sudo docker ps


            echo "====================================="
            echo "Testing application..."
            echo "====================================="

            sleep 5

            curl -f http://localhost:5000 || {
              echo "Application is not responding on port 5000"
              sudo docker logs img1
              exit 1
            }


            echo "====================================="
            echo "Deployment completed successfully!"
            echo "====================================="
